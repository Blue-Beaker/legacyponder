// === CurseForge upload via Python script ===
tasks.register('uploadCurseforge') {
    group 'publishing'
    description 'Upload the built jar to CurseForge using scripts/upload_curseforge.py. Requires CURSEFORGE_TOKEN env var.'
    dependsOn 'reobfJar'

    doLast {
        def jarFile = tasks.named('reobfJar').get().archiveFile.get().asFile
        def scriptPath = file('scripts/upload_curseforge.py')
        exec {
            workingDir = projectDir
            commandLine 'python3', scriptPath, 
            '--file', jarFile.absolutePath,
            '--project-id', propertyString('curseforge_project_id'),
            '--release-type', propertyString('release_type'),
            '--changelog', parserChangelog(),
            '--display_name', "${propertyString('mod_name')} ${propertyString('mod_version')}",
            '--api_token', System.getenv('CURSEFORGE_TOKEN') == null ? "" : System.getenv('CURSEFORGE_TOKEN')
        }
    }
}
tasks.register('uploadCurseforgeDryRun') {
    group 'publishing'
    description 'Dry-run to test the Curseforge uploading configuration.'
    dependsOn 'reobfJar'

    doLast {
        def jarFile = tasks.named('reobfJar').get().archiveFile.get().asFile
        def scriptPath = file('scripts/upload_curseforge.py')
        exec {
            workingDir = projectDir
            commandLine 'python3', scriptPath, 
            '--dry-run',
            '--file', jarFile.absolutePath,
            '--project-id', propertyString('curseforge_project_id'),
            '--release-type', propertyString('release_type'),
            '--changelog', parserChangelog(),
            '--display_name', "${propertyString('mod_name')} ${propertyString('mod_version')}",
            '--api_token', System.getenv('CURSEFORGE_TOKEN') == null ? "" : System.getenv('CURSEFORGE_TOKEN')
        }
    }
}